# A homeserver and an Instagram bridge, for one person, on one machine.
#
# This is deliberately not a production Matrix deployment. There is no
# federation, no TLS, no reverse proxy and no public port: the only client is
# quietdmd running on the same machine. See docs/self-host.md for the steps —
# the containers have to be started in a particular order the first time.
#
# Everything lives under ./data, which is yours to back up and yours to delete.

name: quietdm

services:
  postgres:
    image: docker.io/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in contrib/docker/.env}
      # Synapse requires this collation; the default locale of the image is not
      # accepted and the error it gives is not obvious.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 5s
      timeout: 5s
      retries: 12

  synapse:
    image: docker.io/matrixdotorg/synapse:latest
    restart: unless-stopped
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      # Without these the image chowns everything it generates to its own
      # internal UID/GID, which quietdmd (running as the host user) then has
      # no permission to patch. QUIETDM_UID/GID come from .env.
      UID: ${QUIETDM_UID}
      GID: ${QUIETDM_GID}
    volumes:
      - ./data/synapse:/data
      # The bridge writes its registration file into its own data directory;
      # Synapse only ever needs to read it.
      - ./data/bridge:/appservices:ro
    ports:
      # Loopback only. This homeserver exists to serve one process on this
      # machine, and anything reachable from outside is a thing to secure.
      - "127.0.0.1:8008:8008"
    depends_on:
      postgres:
        condition: service_healthy

  bridge:
    # The Instagram bridge is the same image as the Messenger one under an
    # "ig-" tag; the two are separate binaries in one repository.
    image: dock.mau.dev/mautrix/meta:ig-latest
    restart: unless-stopped
    environment:
      # Same reasoning as the synapse service above: match the host user
      # instead of a fixed in-image ID.
      UID: ${QUIETDM_UID}
      GID: ${QUIETDM_GID}
    volumes:
      - ./data/bridge:/data
    depends_on:
      - synapse
